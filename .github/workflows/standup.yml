name: Post standup order

on:
  schedule:
    # TEMPORARY: 09:35 Europe/London, Mon-Fri, for diagnosing why
    # the schedule trigger has never fired. Revert to a normal
    # morning time once confirmed working.
    - cron: '35 9 * * 1-5'
      timezone: 'Europe/London'
  workflow_dispatch:
      

jobs:
  post-order:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest --repo ${{ github.repository }} -p 'slack-standup-order-bot' -O bot
      - run: chmod +x bot
      - run: ./bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
